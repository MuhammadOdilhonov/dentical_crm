<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Notification</title>
</head>
<body>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <p>Sent by: {{ sender }}</p>
    <p>Received by: {{ recipient }}</p>
    <p>Timestamp: {{ timestamp }}</p>
</body>
</html>
